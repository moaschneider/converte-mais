<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lettro - edição, normalização e conversão de textos</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <header>
    <h1>LETTRO</h1>
    <div>
      <span>COMO USAR</span>
      <span>ATALHOS</span>
      <span>LOGIN</span>
    </div>
  </header>

  <main>
    <div class="entry-data">

      <textarea id="textInput"></textarea>

      <div class="buttons">
        <button id="copyTextButton">Copiar Texto</button>
        <button id="copyHtmlButton">Copiar HTML</button>
        <button id="generateButton" class="tooltip" onclick="generateText()">Gerar
          <span class="tooltiptext">Ctrl + Enter</span>
        </button>
      </div>

      <div class="textos">
        <div id="formatadoContainer" class="textos__html border">
          <div id="htmlResultado"></div>
        </div>
        <div id="referenciasContainer" class="textos__html border" style="display: none;">
          <h6>REFERÊNCIAS</h6>
          <div id="referencias" class="textos__html__gerado">
          </div>
        </div>
        <div class="textos__html border">
          <h6>HTML</h6>
          <pre id="htmlCodigo" class="textos__html__gerado"></pre>
        </div>
        <div class="textos__html border">
          <h6>LISTA DE IMAGENS</h6>
          <div id="htmlListaDeImagens" class="textos__html__gerado">
          </div>
        </div>
      </div>
    </div>

    <div class="entry-data" id="entry-data-pdf">
      <iframe id="iframe"></iframe>
      <div class="pdf-controls">
        <input type="file" id="fileInput" accept=".pdf" class="file-input" onchange="handleFileSelect(this)" />
      </div>
    </div>
  </main>

  <footer>
    <p class="author">Desenvolvido por Moa Schneider • Versão 3.0</p>
  </footer>

  <script src="script.js"></script>

</body>

</html>
